# Default values for todo-backend
replicaCount: 1

image:
  repository: todo-backend
  pullPolicy: Never
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000

initContainerSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  capabilities:
    drop:
    - ALL
    add:
    - NET_ADMIN
    - NET_RAW

# Database configuration
database:
  deployLocal: false  # Set to true to deploy PostgreSQL in-cluster (not recommended for production)
  host: "postgres"    # Change this to your external database host if not deploying locally
  port: "5432"
  name: "todoapp"
  user: "user"
  password: "postgresql-password"  # Only used if deployLocal is true

service:
  type: NodePort
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the backend
env:
  - name: BACKEND_PORT
    value: "8000"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: backend-todo-backend-secrets
        key: database-url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: backend-todo-backend-secrets
        key: jwt-secret
  - name: BACKEND_HOST
    value: "0.0.0.0"
  - name: DEBUG
    value: "True"
  - name: FRONTEND_URL
    value: "http://todo-frontend:80"
  - name: OPENROUTER_API_KEY
    valueFrom:
      secretKeyRef:
        name: backend-todo-backend-secrets
        key: openrouter-api-key
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: backend-todo-backend-secrets
        key: openai-api-key

# Secret configurations
secrets:
  create: true
  databaseUrl: "postgresql+asyncpg://user:password@postgres:5432/todoapp"
  jwtSecret: "default-jwt-secret-change-in-production"
  openrouterApiKey: ""
  openaiApiKey: ""