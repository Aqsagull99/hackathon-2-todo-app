replicaCount: 1

image:
  repository: todo-frontend
  pullPolicy: Never
  tag: "latest"

service:
  type: NodePort
  port: 80
  targetPort: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

dapr:
  enabled: true
  appId: "todo-frontend"
  appPort: "3000"
  logLevel: "debug"
