# Default values for todo-frontend
replicaCount: 1

image:
  repository: todo-frontend
  pullPolicy: Never
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 3001

service:
  type: NodePort
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the frontend
env:
  - name: NEXT_PUBLIC_API_URL
    value: "http://backend-todo-backend:80"
  - name: NEXT_PUBLIC_CHAT_API_URL
    value: "http://backend-todo-backend:80/api/chat"
  - name: BETTER_AUTH_URL
    value: "http://frontend-todo-frontend:80"
  - name: BETTER_AUTH_SECRET
    valueFrom:
      secretKeyRef:
        name: frontend-todo-frontend-secrets
        key: better-auth-secret
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: frontend-todo-frontend-secrets
        key: database-url

# Secret configurations
secrets:
  create: true
  betterAuthSecret: "default-better-auth-secret-change-in-production"
  databaseUrl: "postgresql://user:password@postgres:5432/todoapp"