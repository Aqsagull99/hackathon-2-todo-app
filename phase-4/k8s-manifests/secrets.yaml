apiVersion: v1
kind: Secret
metadata:
  name: neon-db-secret
  namespace: default
type: Opaque
data:
  # These values should be base64 encoded
  # Example: echo -n "your_database_url" | base64
  database-url: <base64-encoded-neon-db-url>

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: default
type: Opaque
data:
  # This should be base64 encoded
  # Example: echo -n "your-jwt-secret" | base64
  jwt-secret: <base64-encoded-jwt-secret>