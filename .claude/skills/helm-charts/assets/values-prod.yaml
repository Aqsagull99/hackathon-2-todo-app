# Production environment specific values
replicaCount: 3

image:
  repository: my-registry.com/my-app
  pullPolicy: IfNotPresent
  tag: "v1.2.3"  # Pin to specific version

imagePullSecrets:
  - name: production-registry-secret

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

service:
  type: LoadBalancer
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: my-app.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: my-app-tls
      hosts:
        - my-app.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  - name: ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"

# Production security and performance configurations
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 2000

priorityClassName: "high-priority"

nodeSelector:
  node-type: production

tolerations:
  - key: node-type
    operator: Equal
    value: production
    effect: NoSchedule

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - my-app
          topologyKey: kubernetes.io/hostname

# Production monitoring
livenessProbe:
  enabled: true
  spec:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
readinessProbe:
  enabled: true
  spec:
    httpGet:
      path: /ready
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Pod Disruption Budget for production
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Production logging
logging:
  enabled: true
  sidecar:
    enabled: true
    image: "fluent/fluent-bit:1.8"
    config: |
      [INPUT]
          Name tail
          Path /var/log/app/*.log
      [OUTPUT]
          Name forward
          Match *
          Host fluentd.default.svc.cluster.local
          Port 24224

# Production tracing
tracing:
  enabled: true
  endpoint: "jaeger-collector.monitoring:14268"